<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <h1>Student Register</h1>
    <form action="" id="form">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter name">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="" name="email" placeholder="Enter email ">
        </div>
        <div>
            <label for="phone">Phone</label>
            <input type="number" id="" name="phone" placeholder="Enter phone">
        </div>
        <label for="" class="label-title">Genter</label>
        <div>
            <input type="radio" id="male" name="gender" required value="male">
            <label for="text">Male</label>
            <input type="radio" id="female" name="gender" required value="female">
            <label for="text">Female</label>
        </div>
        <label for="" class="label-title-apo" > Hobbies</label>
        <div>
            <input type="checkbox" name="hobbies" value="swimming" id="hobbies">
            <label for="swimming">Swimming</label>
        </div>
        <div>
            <input type="checkbox" name="hobbies" value="Reading" id="hobbies">
            <label for="swimming">Reading</label>
        </div>
        <div>
            <input type="checkbox" name="hobbies" value="Dancing" id="hobbies">
            <label for="swimming">Dancing</label>
        </div>
    </form>
    <p></p>
</body>

</html>
